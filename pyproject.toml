[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everypixel-mcp"
version = "0.1.0"
description = "MCP server exposing Everypixel Labs AI image, video, audio, and chat APIs to AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx2>=2,<3",
  "mcp>=2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
everypixel-mcp = "everypixel_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
