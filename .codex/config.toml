#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped Codex defaults. Codex loads this file only after the repository
# is trusted. Keep credentials and machine-specific provider settings in
# ~/.codex/config.toml, never here.
[agents]
max_threads = 4
max_depth = 1

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers."proj-ro-graphify"]
command = "graphify-mcp"
args = ["d:\\Projects\\synthet-code-framework\\graphify-out\\graph.json"]

[mcp_servers."proj-ro-graphify".env]
"WORKSPACE_ROOT" = "${workspaceFolder}"
